services:
  - type: web
    name: devfiesta-backend
    runtime: node
    rootDir: Backend
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: PORT
        value: 4000
      - key: NODE_ENV
        value: production
      - key: DB_HOST
        sync: false
      # Managed MySQL hosts (Aiven, Railway, etc.) almost always use a
      # non-default port - don't assume 3306 here.
      - key: DB_PORT
        sync: false
      - key: DB_USER
        sync: false
      - key: DB_PASS
        sync: false
      - key: DB_NAME
        sync: false
      - key: DB_SSL
        value: true
      # Aiven (and several other managed MySQL hosts) present a self-signed
      # CA that Node's TLS stack won't trust by default. Without this, the
      # connection fails with "self-signed certificate in certificate chain".
      - key: DB_SSL_REJECT_UNAUTHORIZED
        value: false
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRATION
        value: 24h
      - key: CORS_ORIGIN
        sync: false
